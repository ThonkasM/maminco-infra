# =============================================================================
# CI for the maminco-infra repository itself.
# Validates the compose file and the Terraform configuration.
# =============================================================================
name: Infra CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: infra-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create .env for compose interpolation
        run: cp .env.example .env

      - name: Validate docker compose
        run: docker compose config --quiet

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Terraform fmt
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Terraform init (no backend)
        run: terraform -chdir=terraform init -backend=false

      - name: Terraform validate
        run: terraform -chdir=terraform validate
