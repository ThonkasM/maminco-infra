# =============================================================================
# TEMPLATE — identical to maminco-ai/.github/workflows/ci.yml (the real file).
# Keep both in sync. Also copy dependabot-ai.yml to maminco-ai/.github/dependabot.yml
# and create an (initially empty) .trivyignore at the repo root.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ai-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  trivy-fs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Trivy filesystem scan (dependencies, secrets, misconfig)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Checkout infra repo (single source of the Dockerfile)
        uses: actions/checkout@v7
        with:
          repository: ThonkasM/maminco-infra
          path: infra
          token: ${{ secrets.REPOS_READ_TOKEN || github.token }}
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: infra/docker/ai.Dockerfile
          config: infra/.hadolint.yaml
      - name: Build image
        run: docker build -f infra/docker/ai.Dockerfile -t maminco/ai:ci .
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: maminco/ai:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@v4
