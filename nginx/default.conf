# =============================================================================
# Maminco — nginx reverse proxy (single public entrypoint)
# =============================================================================
# Routing:
#   /socket.io/  -> backend:3000  (WebSocket upgrade)
#   /api/        -> backend:3000  (backend routes are already prefixed /api/...)
#   /            -> frontend:3001 (Next.js Node server, NOT static export)
# =============================================================================

upstream maminco_backend {
    server backend:3000;
    keepalive 32;
}

upstream maminco_frontend {
    server frontend:3001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Receipts / product images may be uploaded.
    client_max_body_size 25m;

    # Timeouts suited to a small single-CPU instance.
    proxy_connect_timeout 15s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # --- gzip -------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # --- WebSocket: socket.io --------------------------------------------
    # Make sure the Upgrade/Connection headers survive the proxy hop, and
    # disable proxy buffering so long-lived sockets stay responsive.
    location /socket.io/ {
        proxy_pass         http://maminco_backend;
        proxy_http_version 1.1;

        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- Backend API ------------------------------------------------------
    # No trailing slash on proxy_pass: the /api prefix is preserved.
    location /api/ {
        proxy_pass         http://maminco_backend;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # --- Next.js static assets -------------------------------------------
    location /_next/static/ {
        proxy_pass       http://maminco_frontend;
        proxy_set_header Host $host;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- Frontend (SSR + middleware) -------------------------------------
    location / {
        proxy_pass         http://maminco_frontend;
        proxy_http_version 1.1;

        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --- health check for the load balancer / uptime probes --------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}

# Map used by the frontend block for connection upgrade handling.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
