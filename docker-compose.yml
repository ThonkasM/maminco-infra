# =============================================================================
# Maminco — single-host Docker Compose stack (low-cost EC2 deployment)
# =============================================================================
# Services: postgres, backend (NestJS), ai (FastAPI), frontend (Next.js), nginx.
# Only nginx publishes ports (80/443). Every other service talks over the
# private `maminco` network using its service name as hostname.
#
# The app Dockerfiles live in this infra repo under docker/ and are referenced
# with each app repository as the build context (see the `build.dockerfile`
# paths below), so the application repos stay untouched.
#
# Usage:  cp .env.example .env  &&  docker compose up -d --build
# =============================================================================

name: maminco

# Rotate container logs so they can't fill the small EC2 disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 — persistent data + healthcheck gating the backend.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maminco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maminco}
      POSTGRES_DB: ${POSTGRES_DB:-maminco}
      # Speeds up initdb on small instances; safe for a student project.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-maminco} -d ${POSTGRES_DB:-maminco}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - maminco

  # ---------------------------------------------------------------------------
  # Backend — NestJS + Prisma + socket.io (port 3000, internal only).
  # On boot: apply committed migrations + run the idempotent seed, then start.
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ../maminco-backend
      dockerfile: ../maminco-infra/docker/backend.Dockerfile
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-maminco}:${POSTGRES_PASSWORD:-maminco}@postgres:5432/${POSTGRES_DB:-maminco}?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-please-change-me-please-32}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-token}
      AI_SERVICE_URL: http://ai:8000
    # Push schema + seed, then start. Seed is idempotent (see prisma/seed.ts).
    command: >
      sh -c "
        npx prisma migrate deploy &&
        npx prisma db seed &&
        node dist/main
      "
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - maminco

  # ---------------------------------------------------------------------------
  # AI — FastAPI ML service (port 8000, internal only).
  # AI_INTERNAL_SERVICE_TOKEN MUST equal backend INTERNAL_SERVICE_TOKEN.
  # ---------------------------------------------------------------------------
  ai:
    build:
      context: ../maminco-ai
      dockerfile: ../maminco-infra/docker/ai.Dockerfile
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - path: .env
        required: false
    environment:
      AI_DATABASE_URL: postgresql://${POSTGRES_USER:-maminco}:${POSTGRES_PASSWORD:-maminco}@postgres:5432/${POSTGRES_DB:-maminco}
      AI_INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-token}
      PORT: "8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket;socket.create_connection(('127.0.0.1',8000),2)",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - maminco

  # ---------------------------------------------------------------------------
  # Frontend — Next.js 16 (App Router). Uses middleware, so it is served by a
  # Node process (`next start` on 3001), never as static S3/CloudFront only.
  # NEXT_PUBLIC_* are baked at build time and passed as build args.
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ../maminco-frontend
      dockerfile: ../maminco-infra/docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://localhost}
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "3001"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').connect(3001,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - maminco

  # ---------------------------------------------------------------------------
  # nginx — single public entrypoint (80/443). Reverse proxy + WS upgrade.
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      # Uncomment after mounting certs for TLS (see docs/DEPLOYMENT.md).
      # - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    networks:
      - maminco

volumes:
  pgdata:
    driver: local

networks:
  maminco:
    driver: bridge
