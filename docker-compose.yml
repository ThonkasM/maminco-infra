# =============================================================================
# Maminco — single-host Docker Compose stack (low-cost EC2 deployment)
# =============================================================================
# Services: postgres, migrate (one-shot), backend, ai, frontend, nginx.
# Only nginx publishes ports. postgres and ai live on an internal-only network
# (no route to the internet); backend/frontend/nginx share the `edge` network.
#
# The Dockerfiles live in this repo under docker/ and use each app repo as the
# build context. maminco-ai has no Dockerfile of its own: docker/ai.Dockerfile
# is the single source of truth.
#
# Secrets have NO defaults: `docker compose` aborts if one is missing/empty.
#
#   cp .env.example .env     # fill every empty value
#   docker compose up -d --build                                  # TLS (prod)
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build   # HTTP (dev)
# =============================================================================

name: maminco

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &hardening
  init: true
  restart: unless-stopped
  logging: *default-logging
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 512

x-db-url: &db-url postgresql://${POSTGRES_USER:-maminco}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (openssl rand -hex 32)}@postgres:5432/${POSTGRES_DB:-maminco}?schema=public

services:
  postgres:
    <<: *hardening
    image: postgres:18.7-alpine3.23
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    mem_limit: 384m
    mem_reservation: 256m
    shm_size: 128m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maminco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (openssl rand -hex 32)}
      POSTGRES_DB: ${POSTGRES_DB:-maminco}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:?Set AI_DB_PASSWORD in .env (openssl rand -hex 32)}
    command:
      - postgres
      - -c
      - shared_buffers=96MB
      - -c
      - effective_cache_size=256MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=40
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/10-ai-readonly.sh:/docker-entrypoint-initdb.d/10-ai-readonly.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - internal

  migrate:
    build:
      context: ../maminco-backend
      dockerfile: ../maminco-infra/docker/backend.Dockerfile
      target: migrate
    image: maminco/backend-migrate:local
    init: true
    restart: "no"
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    environment:
      DATABASE_URL: *db-url
      SEED: ${SEED:-false}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  backend:
    <<: *hardening
    build:
      context: ../maminco-backend
      dockerfile: ../maminco-infra/docker/backend.Dockerfile
      target: runtime
    image: maminco/backend:local
    mem_limit: 384m
    mem_reservation: 192m
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=256
      PORT: "3000"
      DATABASE_URL: *db-url
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -hex 32)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN in .env (public origin, e.g. https://pos.example.com)}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in .env (openssl rand -hex 32)}
      AI_SERVICE_URL: http://ai:8000
      REPORT_TIMEZONE: ${REPORT_TIMEZONE:-America/La_Paz}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - edge
      - internal

  ai:
    <<: *hardening
    build:
      context: ../maminco-ai
      dockerfile: ../maminco-infra/docker/ai.Dockerfile
      target: runtime
    image: maminco/ai:local
    mem_limit: 448m
    mem_reservation: 256m
    environment:
      AI_DATABASE_URL: postgresql+psycopg://maminco_ai:${AI_DB_PASSWORD:?Set AI_DB_PASSWORD in .env (openssl rand -hex 32)}@postgres:5432/${POSTGRES_DB:-maminco}
      AI_INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in .env (openssl rand -hex 32)}
      AI_TIMEZONE: ${AI_TIMEZONE:-${REPORT_TIMEZONE:-America/La_Paz}}
      AI_LOG_LEVEL: ${AI_LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - internal

  frontend:
    <<: *hardening
    build:
      context: ../maminco-frontend
      dockerfile: ../maminco-infra/docker/frontend.Dockerfile
      target: runtime
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in .env (public origin)}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:?Set NEXT_PUBLIC_SOCKET_URL in .env (public origin)}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set NEXT_PUBLIC_SITE_URL in .env (public origin)}
    image: maminco/frontend:local
    mem_limit: 256m
    mem_reservation: 128m
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=192
      PORT: "3001"
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in .env (public origin)}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - edge

  nginx:
    <<: *hardening
    image: nginx:1.28.0-alpine
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
      - DAC_OVERRIDE
    mem_limit: 64m
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ORIGIN_VERIFY_SECRET: ${ORIGIN_VERIFY_SECRET:-}
    volumes:
      - ${NGINX_TEMPLATE:-./nginx/templates/https.conf.template}:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/conf.d/00-common.conf:/etc/nginx/conf.d/00-common.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - letsencrypt:/etc/letsencrypt:ro
      - acme-webroot:/var/www/certbot:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - edge

  certbot:
    image: certbot/certbot:v4.0.0
    profiles:
      - certbot
    init: true
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    volumes:
      - letsencrypt:/etc/letsencrypt
      - acme-webroot:/var/www/certbot
    networks:
      - edge

volumes:
  pgdata:
    driver: local
  letsencrypt:
    driver: local
  acme-webroot:
    driver: local

networks:
  edge:
    driver: bridge
  internal:
    driver: bridge
    internal: true
